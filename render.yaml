databases:
  - name: mercatus-db
    plan: free
    databaseName: mercatus
    user: mercatus

services:
  - type: web
    name: mercatus-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mercatus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@mercatus.tech
      - key: ADMIN_PASSWORD
        value: change-me-at-launch
      - key: CORS_ORIGIN
        value: https://your-vercel-app.vercel.app
      - key: REGISTRATION_CODE
        value: change-me-at-launch
      - key: RATE_LIMIT_STORE
        value: postgres
      - key: TICK_INTERVAL_MS
        value: "1000"
      - key: MAX_ROWS_PER_TICK
        value: "5000"
